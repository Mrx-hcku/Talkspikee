name: Build Flutter APK & Get SH1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true

      - name: Fix and Recreate Clean Android Platform & Preserve Keystore
        run: |
          echo "Purana android folder saaf karne se pehle agar key.jks hai toh backup le rahe hain..."
          
          if [ -f "android/google-services.json" ]; then
            cp android/google-services.json ./google-services.json.bak
          elif [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json ./google-services.json.bak
          fi

          if [ -f "android/app/key.jks" ]; then
            cp android/app/key.jks ./key.jks
          fi

          rm -rf android
          flutter create . --platforms=android --project-name talkspike

          if [ -f "./google-services.json.bak" ]; then
            mkdir -p android/app
            mv ./google-services.json.bak android/app/google-services.json
            echo "google-services.json restore ho gaya hai."
          fi

      - name: Fix build.gradle plugins syntax
        run: |
          python3 -c '
          import os
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(path):
                  with open(path, "r") as f:
                      content = f.read()
                  if "com.google.gms.google-services" in content and "plugins {" not in content:
                      content = "plugins {\n    id(\"com.google.gms.google-services\")\n}\n" + content.replace("id(\"com.google.gms.google-services\")", "").replace("\"com.google.gms.google-services\"", "")
                      with open(path, "w") as f:
                          f.write(content)
                      print(f"Syntax fixed in {path}")
          '

      - name: Setup Persistent Keystore & Signing Config
        run: |
          echo "Persistent keystore aur signing configuration setup ho rahi hai..."
          
          mkdir -p android/app

          if [ ! -f "./key.jks" ]; then
            echo "Naya permanent keystore generate kiya ja raha hai..."
            keytool -genkey -v -keystore ./key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass android123 -keypass android123 -dname "CN=Android, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=IN"
          fi

          cp ./key.jks android/app/key.jks

          cat << 'EOF' > android/key.properties
          storePassword=android123
          keyPassword=android123
          keyAlias=key
          storeFile=key.jks
          EOF

          python3 -c '
          import os
          path = "android/app/build.gradle.kts"
          if not os.path.exists(path):
              path = "android/app/build.gradle"

          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()

              if "signingConfigs" not in content:
                  if path.endswith(".kts"):
                      properties_code = """
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """
                      signing_block = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          """
                  else:
                      properties_code = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
                      signing_block = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties.getProperty("keyAlias")
                      keyPassword keystoreProperties.getProperty("keyPassword")
                      storeFile keystoreProperties.getProperty("storeFile") ? file(keystoreProperties.getProperty("storeFile")) : null
                      storePassword keystoreProperties.getProperty("storePassword")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          """

                  content = properties_code + content
                  content = content.replace("android {", "android {" + signing_block)
                  with open(path, "w") as f:
                      f.write(content)
                  print(f"Signing config successfully added to {path}")
          '

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Print Signing Report (SH1 & SHA256)
        run: |
          cd android
          ./gradlew signingReport

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
