name: Build Flutter APK & Get SH1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true

      - name: Verify google-services.json
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "google-services.json present hai."
          else
            echo "Warning: android/app/google-services.json nahi mila!"
          fi

      - name: Fix build.gradle.kts plugins syntax
        run: |
          python3 -c '
          path = "android/app/build.gradle.kts"
          try:
              with open(path, "r") as f:
                  content = f.read()
              if "com.google.gms.google-services" in content and "plugins {" not in content:
                  content = "plugins {\n    id(\"com.google.gms.google-services\")\n}\n" + content.replace("id(\"com.google.gms.google-services\")", "").replace("\"com.google.gms.google-services\"", "")
                  with open(path, "w") as f:
                      f.write(content)
                  print("build.gradle.kts syntax fixed successfully.")
          except Exception as e:
              print(f"Note: {e}")
          '

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Print Signing Report (SH1 & SHA256)
        run: |
          cd android
          ./gradlew signingReport

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
