name: Build Flutter APK & Get SH1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Repository Checkout karo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java (JDK 17) Setup karo jo Gradle build ke liye zaroori hai
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Flutter SDK Setup karo
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true

      # 4. Agar Android folder missing hai toh automatic generate karo
      - name: Ensure Android Platform Exists
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder nahi mila. Generate ho raha hai..."
            flutter create . --platforms=android
          fi

      # 5. Gradle wrapper (`gradlew`) ko execution permission do (Permission Error fix)
      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      # 6. Flutter Dependencies Install karo
      - name: Install Dependencies
        run: flutter pub get

      # 7. Release APK Build karo
      - name: Build APK (Release)
        run: flutter build apk --release

      # 8. SHA1 aur SHA256 Key (Signing Report) Print karo
      - name: Print Signing Report (SH1 & SHA256)
        run: |
          cd android
          ./gradlew signingReport

      # 9. Build hone ke baad APK ko download ke liye available karo
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
